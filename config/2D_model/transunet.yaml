extends: ../cyst.yaml

project:
  name: cyst_2d_transunet_r50_vit_b16

model:
  name: transunet
  type: 2D
  backbone: transunet_encoder
  in_channels: auto
  num_classes: 2
  args:
    __replace__: true
    variant: R50-ViT-B_16
    n_skip: 3
    load_pretrained: true
    pretrained_path: baseline/TransUNet/model/vit_checkpoint/imagenet21k/R50+ViT-B_16.npz

# TransUNet lap input 1 channel thanh RGB noi bo de dung ImageNet weights.
slice_2d:
  num_slices: 1

training:
  epochs: 60
  batch_size: 8
  image_size: [256, 256, 64]
  loss: ce_dice

k_fold:
  enabled: false

evaluation:
  evaluate_2d_as_volume: true
  batch_size: 1
  slice_batch_size: 8

