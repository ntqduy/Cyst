extends: ../cyst.yaml

project:
  name: cyst_adaptive_kernel_moe
  output_root: outputs/Multi_kenel_MoE
  # Change this for each experiment version.
  # Output path: outputs/Multi_kenel_MoE/adaptive_kernel_moe/<output_name>
  output_name: adap_kernel_moe_k8_top2_noise01_dilated3x3x3_d1-6-12_shared3x3x3_concat1x1

model:
  name: adaptive_kernel_moe
  type: 3D
  backbone: adaptive_kernel_moe_encoder
  in_channels: auto
  num_classes: 2
  args:
    __replace__: true
  args_3d:
    __replace__: true
    # Multi_kenel_MoE.adap_kernel_moe.UNetMoE.
    # Sparse encoder MoE experts:
    #   multi-dilated 3x3x3 (d=1,6,12), 1x3x3, 1x5x5,
    #   3x3x3, 5x5x5, 7x7x7.
    # Keep channels modest because large 3D kernels are expensive.
    feature_channels: [16, 32, 64, 128, 256]
    residual: conv
    moe_top_k: 2
    # Learned Noisy Top-k Router. During training, noise_gate predicts a
    # per-sample/per-expert noise std; eval uses clean gate logits.
    moe_noisy_router: true
    # Initial noise std for the learned noisy router.
    moe_router_noise_std: 0.1
    moe_router_noise_epsilon: 0.01
    # Conv3x3x3 + BN + GELU before every sparse MoE block.
    moe_pre_conv: true
    moe_pre_conv_kernel: [3, 3, 3]
    # Shared expert is always active beside routed top-k experts.
    moe_shared_expert: true
    moe_shared_expert_kernel: [3, 3, 3]
    moe_shared_expert_weight: 1.0
    # Routed top-k expert outputs are concatenated then fused by Conv1x1x1.
    moe_routed_fusion: concat_1x1
    # full_scale restores the old UNet 3+ style decoder:
    # all encoder features + previous decoder features at each decoder stage.
    decoder_fusion: full_scale
    # sparse is the safe default. sparse_stream can be faster on some CUDA setups
    # but may trigger asynchronous CUDA/autograd issues with indexed expert dispatch.
    moe_dispatch: sparse

training:
  epochs: 60
  batch_size_3d: 4
  lr: 0.0005
  grad_clip_norm: 1.0
  image_size: [256, 256, 64]
  depth_axis: 2
  volume_layout: DHW
  loss:
    name: ce_dice
    # Total train loss = segmentation loss + moe_balance_weight * UNetMoE.moe_balance_loss().
    moe_balance_weight: 0.01
  amp: false
  save_moe_router_heatmap: true
  moe_router_heatmap_every: 1

k_fold:
  enabled: false

evaluation:
  batch_size_3d: 1
  compute_surface_metrics: true

visualization:
  slice_axis: 0
  # 3D MoE has four 2x depth pools, so Grad-CAM needs at least 16 slices.
  gradcam_depth_window: 16
  gradcam_slice_only: true
