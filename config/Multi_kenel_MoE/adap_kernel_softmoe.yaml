extends: ../cyst.yaml

project:
  name: cyst_adaptive_kernel_softmoe
  output_root: outputs/Multi_kenel_MoE
  # Output path: outputs/Multi_kenel_MoE/adaptive_kernel_softmoe/<output_name>
  output_name: adap_kernel_softmoe_all_experts_noise01_dilated3x3x3_d1-6-12_shared3x3x3_concat1x1_normal_loss

model:
  name: adaptive_kernel_softmoe
  type: 3D
  backbone: adaptive_kernel_softmoe_encoder
  in_channels: auto
  num_classes: 2
  args:
    __replace__: true
  args_3d:
    __replace__: true
    # Multi_kenel_MoE.adap_kernel_softmoe.UNetMoE.
    # SoftMoE routes every voxel through all experts with soft weights.
    # Experts match the sparse MoE reference:
    #   multi-dilated 3x3x3 (d=1,6,12), 1x3x3, 1x5x5,
    #   3x3x3, 5x5x5, 7x7x7.
    feature_channels: [16, 32, 64, 128, 256]
    residual: conv
    # Kept for API compatibility; SoftMoE ignores top-k and activates all experts.
    moe_top_k: 2
    moe_noisy_router: true
    moe_router_noise_std: 0.1
    moe_router_noise_epsilon: 0.01
    moe_pre_conv: true
    moe_pre_conv_kernel: [3, 3, 3]
    moe_shared_expert: true
    moe_shared_expert_kernel: [3, 3, 3]
    moe_shared_expert_weight: 1.0
    moe_routed_fusion: concat_1x1
    moe_dispatch: soft

training:
  epochs: 60
  # SoftMoE evaluates all experts, so this is lower than sparse MoE by default.
  batch_size_3d: 4
  lr: 0.0005
  grad_clip_norm: 1.0
  image_size: [256, 256, 64]
  depth_axis: 2
  volume_layout: DHW
  loss:
    # Normal segmentation loss only; no MoE balance/entropy auxiliary loss.
    name: ce_dice
  amp: false
  save_moe_router_heatmap: true
  moe_router_heatmap_every: 1

k_fold:
  enabled: false

evaluation:
  batch_size_3d: 1
  compute_surface_metrics: true

visualization:
  slice_axis: 0
  gradcam_depth_window: 16
  gradcam_slice_only: true
