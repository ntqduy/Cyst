extends: ../cyst.yaml

project:
  name: cyst_adaptive_kernel_moe_other
  output_root: outputs/Multi_kenel_MoE
  output_name: adap_kernel_moe_other_base

model:
  name: adaptive_kernel_moe_other
  type: 3D
  backbone: adaptive_kernel_moe_other_encoder
  in_channels: auto
  num_classes: 2
  args:
    __replace__: true
  args_3d:
    __replace__: true
    # Multi_kenel_MoE.adap_kernel_moe_other.UNetMoE.
    # Routed experts: 3x3x3 dilation 1, 2, 3, 6, 8, 12.
    # Main branch: always-on 3x3x3.
    # moe_routed_fusion:
    #   concat_1x1 -> concat(main, gate_i * expert_i) then Conv1x1x1.
    #   sum        -> main + sum(gate_i * expert_i).
    # decoder_fusion:
    #   same_scale -> regular U-Net decoder with same-scale skip only.
    #   full_scale -> all encoder features plus previous decoder features.
    # decoder_fusion_channels controls the per-branch projection width in full_scale.
    feature_channels: [16, 32, 64, 128, 256]
    residual: conv
    moe_top_k: 2
    moe_noisy_router: true
    moe_router_noise_std: 0.1
    moe_router_noise_epsilon: 0.01
    moe_pre_conv: true
    moe_pre_conv_kernel: [3, 3, 3]
    moe_shared_expert: false
    moe_shared_expert_kernel: [3, 3, 3]
    moe_shared_expert_weight: 0.0
    moe_routed_fusion: concat_1x1
    moe_dispatch: sparse
    decoder_fusion: same_scale
    decoder_fusion_channels: 16

training:
  epochs: 60
  batch_size_3d: 4
  lr: 0.0005
  grad_clip_norm: 1.0
  image_size: [256, 256, 64]
  depth_axis: 2
  volume_layout: DHW
  loss:
    name: ce_dice
    moe_balance_weight: 0.01
  amp: false
  save_moe_router_heatmap: true
  moe_router_heatmap_every: 1

k_fold:
  enabled: false

evaluation:
  batch_size_3d: 1
  compute_surface_metrics: true

visualization:
  slice_axis: 0
  gradcam_depth_window: 16
  gradcam_slice_only: true
