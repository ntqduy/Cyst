project:
  name: cyst_medthod_fullscale

seed: 42

dataset:
  name: cyst
  root: data
  train_list: train_new.txt
  val_list: val_new.txt
  all_train_list: all_train.txt
  test_list: test.txt
  image_key: image_path
  mask_key: mask_path
  num_classes: 2
  binarize_masks: true
  intensity_normalization: foreground_zscore

experiment:
  name: Medthod_FullScale_proposal_model_experiment
  stage: hybrid  # train_2d | train_3d | hybrid
  use_position_encoder: false

paths:
  output_root: outputs/Medthod_FullScale
  stage1_2d_dir: outputs/Medthod_FullScale/1_2D_model
  stage2_3d_dir: outputs/Medthod_FullScale/2_3D_model
  stage3_hybrid_dir: outputs/Medthod_FullScale/3_hybrid_model

pretrain:
  auto_train_missing_pretrain: false
  stage1_2d_ckpt: auto
  stage2_3d_ckpt: auto
  # Stage 2 trains Unet3D_3plus + Unet3D_3_plus together, so the hybrid
  # decoder should load from the same fold checkpoint as the Stage 2 encoder.
  stage2_3d_decoder_ckpt: outputs/Medthod_FullScale/2_3D_model/Unet3D_3plus_unet3plus3d_full_scale/seed_42/checkpoints/best_model.pth
  load_2d_encoder_from_stage1: true
  load_3d_encoder_from_stage2: true
  load_3d_decoder_from_stage2: true
  strict: false
  freeze_2d_encoder: false
  freeze_3d_encoder: false
  freeze_3d_decoder: false

model:
  # Runner maps stages to proposal_experiment_2d/3d/hybrid.
  # Requested architecture:
  # 2D: Unet2D_3_plus, 3D: Unet3D_3plus, Decoder: Unet3D_3_plus.
  name: proposal_model_experiment
  type: 3D
  backbone: proposal_experiment_hybrid_encoder
  in_channels: 1
  num_classes: 2
  base_channels: 16

  encoder_2d:
    type: Unet2D_3_plus
    channels: [16, 32, 64, 128, 256]

  encoder_3d:
    type: Unet3D_3plus
    channels: [16, 32, 64, 128, 256]

  position_encoder:
    type: embedding
    embedding_dim: 32
    max_positions: 512
    fuse_type: add

  # Change mode here, or override it from a small config:
  # proposal | uniform | random | middle
  slice_selection:
    mode: proposal
    num_slices: 15
    seed: 42
    proposal:
      num_groups: 15
      samples_per_group: 1
      similarity_metric: mad

  # improve hybrid supports concat or add.
  fusion:
    type: add

  decoder_2d:
    model: Unet2D_3_plus
    style: full_scale
    deep_supervision: false

  decoder_3d:
    # Canonical value for the shared runner; equivalent to Unet3D_3_plus.
    model: unet3plus3d
    style: full_scale
    deep_supervision: false

  decoder:
    # Canonical value for the shared runner; equivalent to Unet3D_3_plus.
    model: unet3plus3d
    style: full_scale
    deep_supervision: false

  args:
    __replace__: true
  args_2d:
    __replace__: true
  args_3d:
    __replace__: true

slice_2d:
  # Low-level axis only. Runner derives sampling_strategy and sample count
  # from model.slice_selection so Stage 1 and hybrid stay aligned.
  axis: 2
  position: center

stage1_2d:
  model_name: Experiment2DSegModel
  output_dir: auto
  save_best: true
  export_metrics: true
  export_predictions: true

stage2_3d:
  model_name: Experiment3DSegModel
  output_dir: auto
  save_best: true
  export_metrics: true
  export_predictions: true

stage3_hybrid:
  model_name: ExperimentHybridModel
  output_dir: auto
  load_pretrained_2d_encoder: true
  load_pretrained_3d_encoder: true
  load_pretrained_3d_decoder: true
  train_full_model: true
  export_metrics: true
  export_predictions: true

training:
  epochs: 60
  batch_size: 8
  batch_size_3d: 4
  # Raw-depth 3D stages use this batch size because case depths can vary.
  raw_depth_batch_size_3d: 1
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.0001
  momentum: 0.9
  scheduler: cosine
  min_lr: 0.000001
  loss: ce_dice
  image_size: [256, 256, 64]
  depth_axis: 2
  volume_layout: DHW
  num_workers: 4
  pin_memory: true
  deterministic: true
  show_progress: true
  amp: false
  save_best_by: val_dice

augmentation:
  enabled: true

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.0001

k_fold:
  enabled: true
  source_list: all_train.txt
  num_folds: 3
  shuffle: true
  seed: 42
  reuse_existing: true
  # Run folds in parallel. With gpu.ids "0, 1, 2", three folds run at once,
  # each fold sees one GPU and DataParallel is disabled inside that fold.
  run_parallel: true
  max_parallel_folds: 3
  parallel_single_gpu_per_fold: true
  parallel_gpu_ids: auto

gpu:
  use_cuda: true
  ids: "0, 1, 2"
  multi_gpu: true

evaluation:
  evaluate_2d_as_volume: true
  batch_size: 1
  batch_size_3d: 1
  slice_batch_size: 8
  compute_surface_metrics: true
  compute_flops: true
  fail_on_flops_error: false
  save_predictions_per_split: 7

visualization:
  seed: 42
  selection: per_source
  samples_per_source: 1
  save_per_source: true
  save_diagnostics: true
  gradcam_depth_window: 1
  gradcam_slice_only: true
  fail_on_gradcam_error: false
  max_diagnostic_stages: 5
  slice_axis: 2
  slice_position: label_foreground
