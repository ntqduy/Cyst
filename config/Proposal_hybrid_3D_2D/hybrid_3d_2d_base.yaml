project:
  name: cyst_proposal_hybrid_3d_2d

seed: 42

dataset:
  name: cyst
  root: data
  train_list: train_new.txt
  val_list: val_new.txt
  all_train_list: all_train.txt
  test_list: test.txt
  image_key: image_path
  mask_key: mask_path
  num_classes: 2
  binarize_masks: true
  intensity_normalization: foreground_zscore

experiment:
  name: Proposal_hybrid_3D_2D_improve
  stage: hybrid  # train_2d | train_3d | hybrid
  use_position_encoder: false

paths:
  # Stage 1/2 are shared. Stage 3 keeps only the improve/slice-inject hybrid.
  output_root: outputs/Proposal_hybrid_3D_2D
  stage1_2d_dir: outputs/Proposal_hybrid_3D_2D/1_2D_model
  stage2_3d_dir: outputs/Proposal_hybrid_3D_2D/2_3D_model
  stage3_hybrid_dir: outputs/Proposal_hybrid_3D_2D/Proposal_hybrid_3D_2D_improve/3_hybrid_model

pretrain:
  auto_train_missing_pretrain: false
  stage1_2d_ckpt: auto
  stage2_3d_ckpt: auto
  stage2_3d_decoder_ckpt: auto
  load_2d_encoder_from_stage1: true
  load_3d_encoder_from_stage2: true
  load_3d_decoder_from_stage2: true
  strict: false
  freeze_2d_encoder: false
  freeze_3d_encoder: false
  freeze_3d_decoder: false

model:
  # Runner maps stages to FullUNet3Plus2D, FullUnet3D_3_plus, and the improve hybrid.
  name: proposal_hybrid_3d_2d_improve
  type: 3D
  backbone: hybrid_unet3plus_2d3d_slice_inject_encoder
  in_channels: 1
  num_classes: 2
  base_channels: 16

  encoder_2d:
    type: unet3plus_2d
    channels: [16, 32, 64, 128, 256]

  encoder_3d:
    type: unet3d
    channels: [16, 32, 64, 128, 256]

  position_encoder:
    type: embedding
    embedding_dim: 32
    max_positions: 512
    fuse_type: add

  # Change mode here, or override it from a small config:
  # proposal | uniform | random | middle
  slice_selection:
    mode: proposal
    num_slices: 15
    seed: 42
    proposal:
      num_groups: 15
      samples_per_group: 1
      similarity_metric: mad

  # improve hybrid supports concat or add.
  fusion:
    type: add

  decoder_3d:
    model: unet3plus3d
    style: full_scale
    deep_supervision: false

  decoder:
    model: unet3plus3d
    style: full_scale
    deep_supervision: false

  args:
    __replace__: true
  args_2d:
    __replace__: true
  args_3d:
    __replace__: true

slice_2d:
  # Low-level axis only. Runner derives sampling_strategy and sample count
  # from model.slice_selection so Stage 1 and hybrid stay aligned.
  axis: 2
  position: center

stage1_2d:
  model_name: FullUNet3Plus2D
  output_dir: auto
  save_best: true
  export_metrics: true
  export_predictions: true

stage2_3d:
  model_name: FullUnet3D_3_plus
  output_dir: auto
  save_best: true
  export_metrics: true
  export_predictions: true

stage3_hybrid:
  model_name: Hybrid3D2DUNet3PlusSliceInject
  output_dir: auto
  load_pretrained_2d_encoder: true
  load_pretrained_3d_encoder: true
  load_pretrained_3d_decoder: true
  train_full_model: true
  export_metrics: true
  export_predictions: true

training:
  epochs: 60
  batch_size: 8
  batch_size_3d: 4
  # Raw-depth 3D stages use this batch size because case depths can vary.
  raw_depth_batch_size_3d: 1
  lr: 0.001
  optimizer: adamw
  weight_decay: 0.0001
  momentum: 0.9
  scheduler: cosine
  min_lr: 0.000001
  loss: ce_dice
  image_size: [256, 256, 64]
  depth_axis: 2
  volume_layout: DHW
  num_workers: 4
  pin_memory: true
  deterministic: true
  show_progress: true
  amp: false
  save_best_by: val_dice

augmentation:
  enabled: true

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.0001

k_fold:
  enabled: true
  source_list: all_train.txt
  num_folds: 3
  shuffle: true
  seed: 42
  reuse_existing: true
  # Run folds in parallel. With gpu.ids "0, 1, 2", three folds run at once,
  # each fold sees one GPU and DataParallel is disabled inside that fold.
  run_parallel: true
  max_parallel_folds: 3
  parallel_single_gpu_per_fold: true
  parallel_gpu_ids: auto

gpu:
  use_cuda: true
  ids: "0, 1, 2"
  multi_gpu: true

evaluation:
  evaluate_2d_as_volume: true
  batch_size: 1
  batch_size_3d: 1
  slice_batch_size: 8
  compute_surface_metrics: true
  compute_flops: true
  fail_on_flops_error: false
  save_predictions_per_split: 7

visualization:
  seed: 42
  selection: per_source
  samples_per_source: 1
  save_per_source: true
  save_diagnostics: true
  gradcam_depth_window: 1
  gradcam_slice_only: true
  fail_on_gradcam_error: false
  max_diagnostic_stages: 5
  slice_axis: 2
  slice_position: label_foreground
