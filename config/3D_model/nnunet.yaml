extends: ../cyst.yaml

project:
  name: cyst_3d_nnunet

model:
  name: nnunet3d
  type: 3D
  backbone: nnunet3d_encoder
  in_channels: auto
  num_classes: 2
  args:
    __replace__: true
  args_3d:
    __replace__: true
    feature_channels: [16, 32, 64, 128, 256]
    normalization: instancenorm
    dropout: 0.0

training:
  epochs: 60
  batch_size_3d: 4
  image_size: [256, 256, 64]
  loss: ce_dice

k_fold:
  enabled: false

evaluation:
  batch_size_3d: 1
  compute_surface_metrics: true

