extends: ../cyst.yaml

project:
  name: cyst_3d_swin_unetr

model:
  name: swin_unetr
  type: 3D
  backbone: swin_transformer_3d
  in_channels: auto
  num_classes: 2
  args:
    __replace__: true
  args_3d:
    __replace__: true
    # model_swinvit.pt SSL checkpoint duoc pretrain voi feature_size=48.
    feature_size: 48
    depths: [2, 2, 2, 2]
    num_heads: [3, 6, 12, 24]
    norm_name: instance
    use_checkpoint: true
    drop_rate: 0.0
    attn_drop_rate: 0.0
    dropout_path_rate: 0.0
    load_pretrained: true
    # Relative paths are resolved from CYST_PRETRAIN_DIR (default: ./pretrain).
    pretrained_path: model_swinvit.pt

training:
  epochs: 60
  batch_size_3d: 1
  # Resize ca 3 chieu; khong giu depth goc (mot so case co depth=1).
  preserve_depth: false
  # All dimensions must be divisible by 32 for Swin-UNETR.
  image_size: [256, 256, 64]
  loss: ce_dice
  amp: true

k_fold:
  enabled: true
  # Dung chung dung bo split voi cac experiment khac trong repo.
  source_list: all_train.txt
  num_folds: 3
  shuffle: true
  seed: 42
  reuse_existing: true
  run_parallel: true
  max_parallel_folds: 3
  parallel_single_gpu_per_fold: true
  parallel_gpu_ids: auto

gpu:
  use_cuda: true
  ids: "0, 1, 2"
  multi_gpu: true

evaluation:
  batch_size_3d: 1
  compute_surface_metrics: true
