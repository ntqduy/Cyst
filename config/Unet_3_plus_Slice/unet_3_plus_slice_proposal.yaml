extends: ../cyst.yaml

project:
  name: cyst_unet_3_plus_slice_proposal
  # Doi output_root/output_name khi thu nhieu method de khong de len nhau.
  output_root: outputs/Unet_3_plus_Slice
  output_name: unet3plus_slice_proposal_mad_g15_s15

dataset:
  # Override dataset root o day neu muon chay tren bo data khac.
  # Vi du: root: E:/cyst/cyst/data_new
  root: data

model:
  name: unet_3_plus_slice
  type: 3D
  backbone: unet3plus_slice_encoder
  in_channels: 1
  num_classes: 2
  args:
    __replace__: true
    feature_scale: 4
    is_deconv: true
    is_batchnorm: true
    internal_num_classes: 2
    deep_supervision: false
    cgm: false
    volume_fusion: linear_interpolate
    slice_selection:
      mode: proposal
      num_slices: 15
      seed: 42
      proposal:
        num_groups: 15
        samples_per_group: 1
        # Dang ho tro: mad | mean_absolute_deviation | cos | cosine | cosine_similarity.
        # Doi output_name ben tren tuong ung khi thu method khac.
        similarity_metric: mad

training:
  epochs: 60
  batch_size_3d: 4
  image_size: [256, 256, 64]
  depth_axis: 2
  volume_layout: DHW
  loss: ce_dice
  amp: false

early_stopping:
  enabled: true
  patience: 10
  min_delta: 0.0001

k_fold:
  enabled: false

evaluation:
  batch_size_3d: 1
  compute_surface_metrics: true
  compute_flops: true
  fail_on_flops_error: false
  save_predictions_per_split: 7

visualization:
  slice_axis: 0
  slice_position: label_foreground
